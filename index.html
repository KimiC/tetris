<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Tetris</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Simple Tetris Game</h1>
    <div id="scoreDisplay">Score: 0</div>
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <button id="startButton">Start Game</button>
    <button id="pauseButton">Pause</button>
    <canvas id="nextPieceCanvas" width="120" height="120" style="background-color: #222; display: block; margin: 10px auto; position: absolute; top: 100px; left: calc(75% - 60px); border: 2px solid white;"></canvas>
    <script src="script.js"></script>
</body>
</html>
